<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project 3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background-color: #333;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
    }

    .clock {
      font-size: 3.5rem;
      font-weight: bold;
      background: #fff;
      color: #333;
      padding: 20px 40px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }

    form {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    label {
      font-size: 1.2rem;
      color: #333;
    }

    input[type="number"] {
      padding: 10px;
      font-size: 1rem;
      width: 100px;
      border: 2px solid #ccc;
      border-radius: 8px;
      margin-left: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #fff;
      color: #333;
      border: 1px solid #333;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #333;
      color:#ccc
    }

    #show {
      font-size: 2rem;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="clock" id="clock"></div>

  <div>
    <form>
      <label>Minutes:
        <input type="number" id="minutes" />
      </label>
      <button type="submit">Set Timer</button>
      <p id="show" hidden="true"></p>
    </form>
  </div>
<script src="script.js"></script>
</html>
